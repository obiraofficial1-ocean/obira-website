<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation - OBIRA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="marketing.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header class="header"><div class="logo"><img src="logo.png" alt="OBIRA"></div><nav class="nav"><a href="index.html"><i class="fa fa-home"></i> Home</a><a href="store.html"><i class="fa fa-store"></i> Store</a><a href="wishlist.html" id="wishlist-link"><i class="fa fa-heart"></i> Favourites <span id="wishlist-badge" class="wishlist-badge">0</span></a><a href="cart.html"><i class="fa fa-shopping-cart cart-icon"></i> Cart <span id="cart-badge">0</span></a></nav></header>
  <main id="confirmation-container"></main>
  <footer class="footer"><div class="footer-grid"><div><h3>OBIRA</h3><div class="social-icons"><a href="https://www.instagram.com/obira.official" target="_blank"><i class="fab fa-instagram"></i></a><a href="https://www.facebook.com/share/1CZx4pnAAb/" target="_blank"><i class="fab fa-facebook"></i></a><a href="https://www.youtube.com/@OBIRA.OFFICIAL1" target="_blank"><i class="fab fa-youtube"></i></a><a href="https://pin.it/7GoYisUBN" target="_blank"><i class="fab fa-pinterest"></i></a></div></div><div><h3>Contact</h3><p>Email: obiraofficial1@gmail.com</p><p>Phone: +91 8792957799</p></div><div><h3>Help</h3><ul><li><a href="policy.html">Store Policy</a></li><li><a href="privacy.html">Privacy Policy</a></li><li><a href="track.html">Track Order</a></li></ul></div></div></footer>
  <div id="notification"></div>
  <script src="products.js"></script><script src="script.js"></script><script src="purchase-note.js"></script>
  <script>
    function loadOrderConfirmation() {
      const container = document.getElementById('confirmation-container');
      const paymentId = sessionStorage.getItem('paymentId');
      const shipping = JSON.parse(localStorage.getItem('shippingDetails') || '{}');
      const cart = JSON.parse(sessionStorage.getItem('orderCart') || localStorage.getItem('cart') || '[]');
      if (!paymentId || !cart.length) { container.innerHTML = '<div class="empty-state">No order information found. <a href="index.html">Back to Home</a></div>'; return; }
      const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const tax = Math.round(subtotal * 0.02);
      const shippingCost = 49;
      const total = subtotal + tax + shippingCost;
      container.innerHTML = `<section class="about confirmation-card"><div class="confirmation-success"><span>✓</span><h1>Payment Successful!</h1><p>Your OBIRA order is confirmed.</p></div><div class="confirmation-meta"><p><strong>Order ID</strong><br>ORD${Date.now()}</p><p><strong>Payment ID</strong><br>${paymentId}</p></div><h2>Order Items</h2><div class="confirmation-items">${cart.map(item => `<div><span>${item.name} × ${item.qty}</span><strong>₹${item.price * item.qty}</strong></div>`).join('')}</div><div class="summary-card"><p class="summary-row"><span>Subtotal</span><strong>₹${subtotal}</strong></p><p class="summary-row"><span>Tax (2%)</span><strong>₹${tax}</strong></p><p class="summary-row"><span>Shipping</span><strong>₹${shippingCost}</strong></p><p class="summary-row total"><span>Total</span><strong>₹${total}</strong></p></div><h2>Shipping Address</h2><p>${shipping.fullName || 'N/A'}<br>${shipping.address1 || 'N/A'}<br>${shipping.city || 'N/A'}, ${shipping.state || 'N/A'} - ${shipping.postalCode || 'N/A'}</p><div class="occasion-note-card"><span class="obira-chat-kicker">A note from OBIRA</span><p id="occasion-note">Your thoughtful order is on its way. ✨</p></div><p class="confirmation-tagline"><em>Your world—amplified, beautifully.</em></p><div class="confirmation-actions"><a class="checkout-btn" href="track.html">Track Order</a><a class="inline-link" href="index.html">Back to Home</a></div></section>`;
      localStorage.removeItem('cart');
      sessionStorage.removeItem('paymentId');
    }
    window.addEventListener('load', loadOrderConfirmation);
  </script>
</body>
</html>
